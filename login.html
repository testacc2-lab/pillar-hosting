<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pillar Hosting — Login</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Animated background -->
  <canvas id="bgCanvas"></canvas>
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <!-- Back to home -->
  <a href="index.html" class="back-home">
    <svg viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to home
  </a>

  <!-- Auth card -->
  <div class="auth-wrap">
    <div class="auth-card" id="authCard">

      <!-- Logo -->
      <div class="auth-logo">
        <svg viewBox="0 0 32 32" fill="none" class="auth-logo-icon">
          <rect x="4"  y="8"  width="6" height="18" rx="2" fill="#6366f1"/>
          <rect x="13" y="4"  width="6" height="22" rx="2" fill="#818cf8"/>
          <rect x="22" y="10" width="6" height="16" rx="2" fill="#6366f1"/>
        </svg>
        <span>Pillar Hosting</span>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <!-- Error / success banners -->
      <div class="auth-banner error" id="bannerError" style="display:none"></div>
      <div class="auth-banner success" id="bannerSuccess" style="display:none"></div>

      <!-- ── LOGIN FORM ── -->
      <form class="auth-form" id="formLogin" onsubmit="handleLogin(event)">
        <div class="field-group">
          <label for="loginEmail">Email address</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none"><path d="M3 5h14l-7 7-7-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 5v10h14V5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field-group">
          <label for="loginPassword">Password</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="eye-btn" onclick="togglePass('loginPassword', this)">
              <svg viewBox="0 0 20 20" fill="none"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="btnLogin">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" style="display:none">
            <svg class="spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-dasharray="28 56"/></svg>
          </span>
        </button>
      </form>

      <!-- ── SIGNUP FORM ── -->
      <form class="auth-form" id="formSignup" style="display:none" onsubmit="handleSignup(event)">
        <div class="field-group">
          <label for="signupName">Display name</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="text" id="signupName" placeholder="John Doe" autocomplete="name" required />
          </div>
        </div>
        <div class="field-group">
          <label for="signupEmail">Email address</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none"><path d="M3 5h14l-7 7-7-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 5v10h14V5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field-group">
          <label for="signupPassword">Password</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="password" id="signupPassword" placeholder="Min. 6 characters" autocomplete="new-password" required />
            <button type="button" class="eye-btn" onclick="togglePass('signupPassword', this)">
              <svg viewBox="0 0 20 20" fill="none"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <button type="submit" class="btn-auth" id="btnSignup">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner" style="display:none">
            <svg class="spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-dasharray="28 56"/></svg>
          </span>
        </button>
        <p class="auth-terms">By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or</span></div>

      <!-- Demo login -->
      <button class="btn-demo" onclick="demoLogin()">
        Try Demo Account
      </button>

    </div>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
